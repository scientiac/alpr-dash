<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Plates</title>
<style>
  :root {
    --bg:#fafafa; --card:#fff; --fg:#09090b; --muted:#71717a; --border:#e4e4e7;
    --subtle:#f4f4f5; --ok:#16a34a; --ok-bg:#dcfce7; --radius:10px;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#09090b; --card:#0f0f11; --fg:#fafafa; --muted:#a1a1aa; --border:#27272a;
            --subtle:#18181b; --ok:#4ade80; --ok-bg:#14532d55; }
  }
  * { box-sizing:border-box; }
  html, body { height:100%; }
  body { margin:0; background:var(--bg); color:var(--fg);
         font:14px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Inter, sans-serif;
         -webkit-font-smoothing:antialiased; }

  .app { height:100vh; max-width:1440px; margin:0 auto; padding:24px 32px;
         display:flex; flex-direction:column; gap:20px; }

  header { display:flex; align-items:center; justify-content:space-between; gap:16px; }
  h1 { font-size:20px; font-weight:600; letter-spacing:-.02em; margin:0; }
  .sub { color:var(--muted); font-size:13px; margin:2px 0 0; }

  .card { background:var(--card); border:1px solid var(--border); border-radius:var(--radius);
          box-shadow:0 1px 2px rgba(0,0,0,.04); }

  .stats { display:grid; grid-template-columns:repeat(5, 1fr); gap:16px; }
  .stat { padding:16px 20px; }
  .stat .label { color:var(--muted); font-size:13px; font-weight:500; }
  .stat .value { font-size:28px; font-weight:600; letter-spacing:-.02em; line-height:1.2; margin-top:4px;
                 font-variant-numeric:tabular-nums; }

  .main { flex:1; min-height:0; display:grid; grid-template-columns:1fr 1.15fr; gap:16px; }
  .panel { display:flex; flex-direction:column; min-height:0; overflow:hidden; }
  .panel-head { display:flex; align-items:center; justify-content:space-between; gap:12px;
                padding:14px 20px; border-bottom:1px solid var(--border); }
  .panel-head h2 { font-size:14px; font-weight:600; margin:0; }
  .panel-head .hint { color:var(--muted); font-size:12px; }

  .video-wrap { flex:1; min-height:0; background:#000; display:flex; align-items:center; justify-content:center; }
  .video-wrap img { width:100%; height:100%; object-fit:contain; display:block; }
  .inview { display:flex; gap:8px; flex-wrap:wrap; align-items:center; padding:12px 20px;
            border-top:1px solid var(--border); min-height:49px; }
  .chip { font-family:ui-monospace, SFMono-Regular, Menlo, monospace; font-size:13px; font-weight:600;
          letter-spacing:.06em; padding:2px 10px; border-radius:6px; background:var(--subtle);
          border:1px solid var(--border); }
  .chip small { font-family:ui-sans-serif, system-ui, sans-serif; font-weight:500; letter-spacing:0;
                color:var(--muted); margin-left:6px; }

  .table-wrap { flex:1; min-height:0; overflow:auto; }
  table { width:100%; border-collapse:collapse; }
  thead th { position:sticky; top:0; background:var(--card); text-align:left; font-size:12px;
             font-weight:500; color:var(--muted); padding:10px 20px; border-bottom:1px solid var(--border); }
  tbody td { padding:8px 20px; border-bottom:1px solid var(--border); white-space:nowrap;
             font-variant-numeric:tabular-nums; vertical-align:middle; }
  tbody tr { cursor:pointer; }
  tbody tr:hover { background:var(--subtle); }
  td.plate { font-family:ui-monospace, SFMono-Regular, Menlo, monospace; font-weight:600; letter-spacing:.06em; }
  td.plate img { height:26px; max-width:96px; object-fit:contain; border-radius:4px; vertical-align:middle;
                 margin-right:10px; background:var(--subtle); }
  td.num, th.num { text-align:right; }
  td.veh { color:var(--muted); text-transform:capitalize; }
  .dir { font-size:12px; font-weight:500; padding:1px 8px; border-radius:999px; border:1px solid var(--border); }
  .dir.in { color:var(--ok); background:var(--ok-bg); border-color:transparent; }

  dialog { border:1px solid var(--border); border-radius:var(--radius); background:var(--card); color:var(--fg);
           padding:0; width:min(720px, 92vw); box-shadow:0 10px 40px rgba(0,0,0,.25); }
  dialog::backdrop { background:rgba(0,0,0,.5); }
  .d-head { display:flex; align-items:center; justify-content:space-between; padding:14px 20px;
            border-bottom:1px solid var(--border); }
  .d-head h2 { margin:0; font:600 18px ui-monospace, SFMono-Regular, Menlo, monospace; letter-spacing:.06em; }
  .d-close { font:inherit; font-size:20px; line-height:1; background:none; border:0; color:var(--muted); cursor:pointer; }
  .d-body { padding:20px; display:grid; gap:16px; }
  .d-body img { width:100%; max-height:52vh; object-fit:contain; background:#000; border-radius:8px; display:block; }
  .d-body img.plate-img { max-height:90px; width:auto; max-width:100%; background:none; }
  dl { display:grid; grid-template-columns:auto 1fr; gap:6px 20px; margin:0; font-size:13px; }
  dt { color:var(--muted); }
  dd { margin:0; text-transform:capitalize; }
  .empty { color:var(--muted); text-align:center; padding:40px 20px !important; }
  .muted { color:var(--muted); font-size:13px; }

  @media (max-width:900px) {
    .app { height:auto; padding:16px; }
    .stats { grid-template-columns:repeat(2, 1fr); }
    .main { grid-template-columns:1fr; }
    .video-wrap { aspect-ratio:16/9; flex:none; }
    .table-wrap { max-height:60vh; }
    header { flex-wrap:wrap; }
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <div>
      <h1>License Plate Recognition</h1>
      <p class="sub">Real-time detection, tracking and logging</p>
    </div>
  </header>

  <section class="stats">
    <div class="card stat"><div class="label">Vehicles logged</div><div class="value" id="n-total">0</div></div>
    <div class="card stat"><div class="label">Incoming</div><div class="value" id="n-in">0</div></div>
    <div class="card stat"><div class="label">Outgoing</div><div class="value" id="n-out">0</div></div>
    <div class="card stat"><div class="label">In view</div><div class="value" id="n-live">0</div></div>
    <div class="card stat"><div class="label">Processing speed</div><div class="value" id="fps">–</div></div>
  </section>

  <section class="main">
    <div class="card panel">
      <div class="panel-head"><h2>Live feed</h2><span class="hint" id="src-name"></span></div>
      <div class="video-wrap"><img src="/stream.mjpg" alt="live video"></div>
      <div class="inview" id="live"></div>
    </div>

    <div class="card panel">
      <div class="panel-head"><h2>Logged vehicles</h2><span class="hint">Newest first · click a row for photos</span></div>
      <div class="table-wrap">
        <table>
          <thead><tr><th>Time</th><th>Plate</th><th>Vehicle</th><th>Direction</th><th class="num">Confidence</th></tr></thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
    </div>
  </section>
</div>

<dialog id="detail">
  <div class="d-head"><h2 id="d-plate"></h2><button class="d-close" id="d-close" aria-label="Close">&times;</button></div>
  <div class="d-body">
    <img id="d-vehicle" alt="vehicle">
    <img id="d-plate-img" class="plate-img" alt="plate">
    <dl id="d-info"></dl>
  </div>
</dialog>

<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const img = p => p ? "/images/" + p.split("/").map(encodeURIComponent).join("/") : "";
const looks = p => [p.colour, p.make, p.vehicle_type].filter(Boolean).join(" ") || "–";
const dir = d => d ? `<span class="dir ${d}">${d === "in" ? "In" : "Out"}</span>` : `<span class="muted">–</span>`;
let plates = [], shown = "";

async function refresh() {
  try {
    const s = await (await fetch("/api/state")).json();
    $("src-name").textContent = s.source || "";
    $("fps").textContent = s.done ? "–" : `${s.fps.toFixed(0)} fps`;
    $("n-total").textContent = s.stats.total;
    $("n-in").textContent = s.stats.incoming;
    $("n-out").textContent = s.stats.outgoing;
    $("n-live").textContent = s.active.length;

    $("live").innerHTML = s.active.length
      ? s.active.map(t => `<span class="chip">${esc(t.plate || "…")}<small>#${t.id}</small></span>`).join("")
      : `<span class="muted">No plates in view</span>`;

    // Rebuild the table only when the records change, so images do not flicker
    const key = JSON.stringify(s.plates);
    if (key === shown) return;
    shown = key;
    plates = s.plates;
    $("rows").innerHTML = plates.length
      ? plates.map((p, i) =>
          `<tr data-i="${i}" title="${esc(p.time)} · ${esc(p.source)}"><td>${esc(p.time.slice(11))}</td>` +
          `<td class="plate"><img src="${img(p.plate_image)}" alt="" loading="lazy">${esc(p.plate)}</td>` +
          `<td class="veh">${esc(looks(p))}</td><td>${dir(p.direction)}</td>` +
          `<td class="num">${p.confidence}%</td></tr>`).join("")
      : `<tr><td colspan="5" class="empty">No vehicles logged yet</td></tr>`;
  } catch (e) {}
}

$("rows").onclick = e => {
  const tr = e.target.closest("tr[data-i]");
  if (!tr) return;
  const p = plates[tr.dataset.i];
  $("d-plate").textContent = p.plate;
  $("d-vehicle").src = img(p.vehicle_image);
  $("d-plate-img").src = img(p.plate_image);
  const info = [["Time", p.time], ["Direction", p.direction ?? "unknown"], ["Type", p.vehicle_type ?? "unknown"],
                ["Colour", p.colour ?? "unknown"], ["Make", p.make ?? "unknown"],
                ["Confidence", `${p.confidence}% (${p.readings} readings)`], ["Source", p.source]];
  $("d-info").innerHTML = info.map(([k, v]) => `<dt>${k}</dt><dd>${esc(v)}</dd>`).join("");
  $("detail").showModal();
};
$("d-close").onclick = () => $("detail").close();
$("detail").onclick = e => { if (e.target === $("detail")) $("detail").close(); };

refresh();
setInterval(refresh, 500);
</script>
</body>
</html>
