<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Plates</title>
<style>
  :root { --fg:#111; --muted:#777; --line:#e5e5e5; --bg:#fff; --accent:#0a7; }
  @media (prefers-color-scheme: dark) {
    :root { --fg:#eee; --muted:#888; --line:#2a2a2a; --bg:#111; }
  }
  * { box-sizing: border-box; }
  body { margin:0; padding:24px; font:14px/1.5 system-ui, sans-serif; color:var(--fg); background:var(--bg); }
  .wrap { max-width:1300px; margin:0 auto; display:grid; grid-template-columns:minmax(0,3fr) minmax(280px,2fr); gap:24px; }
  @media (max-width:900px) { .wrap { grid-template-columns:1fr; } }
  h1 { font-size:16px; font-weight:600; margin:0 0 16px; }
  .video { width:100%; background:#000; border-radius:6px; display:block; aspect-ratio:16/9; object-fit:contain; }
  .meta { color:var(--muted); margin-top:8px; display:flex; gap:16px; flex-wrap:wrap; }
  .stats { display:flex; gap:24px; margin-bottom:16px; }
  .stat b { display:block; font-size:28px; font-weight:600; line-height:1.1; }
  .stat span { color:var(--muted); font-size:12px; }
  .bar { display:flex; justify-content:space-between; align-items:center; margin:16px 0 8px; }
  h2 { font-size:13px; font-weight:600; margin:0; color:var(--muted); text-transform:uppercase; letter-spacing:.04em; }
  button { font:inherit; padding:6px 12px; border:1px solid var(--line); background:transparent; color:var(--fg); border-radius:6px; cursor:pointer; }
  button:hover { border-color:var(--muted); }
  .scroll { max-height:60vh; overflow:auto; }
  table { width:100%; border-collapse:collapse; }
  th, td { text-align:left; padding:6px 8px; border-bottom:1px solid var(--line); white-space:nowrap; }
  th { color:var(--muted); font-weight:500; font-size:12px; }
  td.plate { font-family:ui-monospace, monospace; font-size:15px; font-weight:600; letter-spacing:.05em; }
  .live { color:var(--accent); }
  .empty { color:var(--muted); padding:12px 8px; }
</style>
</head>
<body>
<div class="wrap">
  <section>
    <h1>License plates</h1>
    <img class="video" src="/stream.mjpg" alt="live video">
    <div class="meta"><span id="source">–</span><span id="fps"></span></div>
  </section>

  <section>
    <div class="stats">
      <div class="stat"><b id="n-total">0</b><span>vehicles logged</span></div>
      <div class="stat"><b id="n-unique">0</b><span>unique plates</span></div>
      <div class="stat"><b id="n-live">0</b><span>in view</span></div>
    </div>

    <div class="bar"><h2>In view</h2></div>
    <table><tbody id="live"></tbody></table>

    <div class="bar"><h2>Logged</h2><button id="export">Export CSV</button></div>
    <div class="scroll">
      <table>
        <thead><tr><th>Time</th><th>Plate</th><th>Conf.</th><th>Reads</th><th>Source</th></tr></thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
  </section>
</div>

<script>
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let plates = [];

async function refresh() {
  try {
    const s = await (await fetch("/api/state")).json();
    plates = s.plates;
    $("source").textContent = s.done ? "Finished" : (s.source || "–");
    $("fps").textContent = s.done ? "" : `${s.fps.toFixed(1)} fps`;
    $("n-total").textContent = plates.length;
    $("n-unique").textContent = new Set(plates.map(p => p.plate)).size;
    $("n-live").textContent = s.active.length;

    $("live").innerHTML = s.active.length
      ? s.active.map(t => `<tr><td>#${t.id}</td><td class="plate live">${esc(t.plate || "…")}</td><td>${t.reads} reads</td></tr>`).join("")
      : `<tr><td class="empty">No plates in view</td></tr>`;

    $("rows").innerHTML = plates.length
      ? plates.slice().reverse().map(p =>
          `<tr><td>${esc(p.timestamp.slice(11))}</td><td class="plate">${esc(p.plate)}</td>` +
          `<td>${p.confidence}%</td><td>${p.readings}</td><td>${esc(p.source)}</td></tr>`).join("")
      : `<tr><td colspan="5" class="empty">Nothing logged yet</td></tr>`;
  } catch (e) {
    $("source").textContent = "Disconnected";
  }
}

$("export").onclick = () => {
  const cols = ["timestamp", "source", "plate", "confidence", "readings"];
  const quote = v => `"${String(v).replace(/"/g, '""')}"`;
  const csv = [cols.join(","), ...plates.map(p => cols.map(c => quote(p[c])).join(","))].join("\n");
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([csv], {type: "text/csv"}));
  a.download = `plates-${new Date().toISOString().slice(0, 19).replace(/:/g, "-")}.csv`;
  a.click();
  URL.revokeObjectURL(a.href);
};

refresh();
setInterval(refresh, 500);
</script>
</body>
</html>
